services:
  db:
    image: postgres:15-alpine
    container_name: openrubberdocks-db
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-openrubberdocks}
    ports:
      # STRICT SECURITY: Always bind PostgreSQL to 127.0.0.1 (loopback only).
      # This prevents Docker from inserting 0.0.0.0 DNAT rules into iptables that bypass
      # host firewalls (UFW/firewalld) and prevents exposing the database to the internet.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - openrubberdocks-net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-openrubberdocks}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: openrubberdocks-backend
    restart: unless-stopped
    ports:
      # Bound to 127.0.0.1 by default to respect host iptables/UFW firewalls (safe for local dev or reverse proxy).
      # Set HOST_BIND_IP=0.0.0.0 in .env only if you want direct public port exposure without a reverse proxy.
      - "${HOST_BIND_IP:-127.0.0.1}:${PORT:-3000}:3000"
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
      - STORAGE_LOCAL_PATH=${STORAGE_LOCAL_PATH:-/var/lib/openrubberdocks/storage}
      - STORAGE_DEFAULT_QUOTA_BYTES=${STORAGE_DEFAULT_QUOTA_BYTES:-524288000}
      - STORAGE_S3_ENDPOINT=${STORAGE_S3_ENDPOINT:-http://rustfs:9000}
      - STORAGE_S3_REGION=${STORAGE_S3_REGION:-us-east-1}
      - STORAGE_S3_BUCKET=${STORAGE_S3_BUCKET:-openrubberdocks-storage}
      - STORAGE_S3_ACCESS_KEY=${STORAGE_S3_ACCESS_KEY:-rustfsadmin}
      - STORAGE_S3_SECRET_KEY=${STORAGE_S3_SECRET_KEY:-rustfssecretpassword}
      - STORAGE_S3_FORCE_PATH_STYLE=${STORAGE_S3_FORCE_PATH_STYLE:-true}
    volumes:
      - storage_data:/var/lib/openrubberdocks/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - openrubberdocks-net
    security_opt:
      - no-new-privileges:true

  rustfs:
    profiles:
      - s3
      - full
    image: rustfs/rustfs:latest
    container_name: openrubberdocks-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-rustfssecretpassword}
      RUSTFS_VOLUMES: /data
    ports:
      - "127.0.0.1:${RUSTFS_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs_data:/data
    networks:
      - openrubberdocks-net
    security_opt:
      - no-new-privileges:true

  frontend:
    profiles:
      - full
      - production
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    container_name: openrubberdocks-frontend
    restart: unless-stopped
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    networks:
      - openrubberdocks-net
    security_opt:
      - no-new-privileges:true

networks:
  openrubberdocks-net:
    driver: bridge

volumes:
  pgdata:
  storage_data:
  rustfs_data:
